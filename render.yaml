services:
  # Web service для Rails приложения
  - type: web
    name: task4-ruby-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task4-ruby-db
          property: connectionString

databases:
  # PostgreSQL база
  - name: task4-ruby-db
    databaseName: task4_ruby_production
    user: task4_ruby
    plan: free
    region: oregon
    ipAllowList: []