# SQLite for development/test, PostgreSQL for production

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: task4_ruby_production
    username: task4_ruby
    password: <%= ENV["TASK4_RUBY_DATABASE_PASSWORD"] %>
    host: <%= ENV["DATABASE_HOST"] %>
    port: <%= ENV["DATABASE_PORT"] || 5432 %>
  cache:
    <<: *primary_production
    database: task4_ruby_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: task4_ruby_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: task4_ruby_production_cable
    migrations_paths: db/cable_migrate